[build-system]
requires = ["setuptools>=69,<76", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-track-b-graph"
version = "0.1.0"
description = "Track B graph, corpus, retrieval and extraction service for the Guarded Browsing Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6,<7",
  "lxml>=5,<7",
  "pdfminer.six>=20240706",
  "python-docx>=1.1,<2",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
  "boto3>=1.35,<2",
  "sentence-transformers>=3,<6",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "respx>=0.21,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "schemathesis>=3,<5", "types-PyYAML>=6.0.12"]
gnn = ["torch>=2.3,<3", "torch-geometric>=2.5,<3"]

[project.scripts]
gba-graph = "gba_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gba_graph"]

