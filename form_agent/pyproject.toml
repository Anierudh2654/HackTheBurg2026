[build-system]
requires = ["setuptools>=69,<76", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-live-form-agent"
version = "0.2.0"
description = "Prompt-driven, human-supervised browser and editable PDF form agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "selenium>=4.26,<5",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=6.21,<7",
  "PyMuPDF>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
